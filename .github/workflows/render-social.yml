name: Render Pantry Pal social image
on:
  push:
    branches: [feature/pantry-pal-responsive-seo-a11y-20261029]
    paths:
      - social-preview.svg
      - .github/workflows/render-social.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg==2.8.2
      - name: Render PNG from branded SVG
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          cairosvg.svg2png(url='social-preview.svg',write_to='social-preview.png',output_width=1200,output_height=630)
          assert Path('social-preview.png').stat().st_size>8000
          PY
      - name: Save image on branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add shareable social preview PNG'
            git push origin HEAD:feature/pantry-pal-responsive-seo-a11y-20261029
          fi
